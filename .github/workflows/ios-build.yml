name: iOS build

on:
  workflow_dispatch:
  push:
    paths:
      - "NetPulse/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS Simulator
        run: |
          xcodebuild -project NetPulse/NetPulse.xcodeproj -target NetPulse \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build

      # Runs only when started by hand: launches the app in a simulator, fails if it
      # crashes, and saves a screenshot of each tab to docs/screenshots.
      - name: Launch in simulator and take screenshots
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          APP=NetPulse/build/Debug-iphonesimulator/NetPulse.app
          BUNDLE=com.example.NetPulse
          UDID=$(xcrun simctl list devices available | grep -E "iPhone [0-9]+ Pro \(" | tail -1 | grep -oE "[0-9A-F-]{36}")
          xcrun simctl list devices available | grep "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location "$BUNDLE"
          mkdir -p docs/screenshots
          index=0
          for name in live speed consistency data; do
            xcrun simctl launch "$UDID" "$BUNDLE" -initialTab "$index"
            sleep 20
            xcrun simctl io "$UDID" screenshot "docs/screenshots/$name.png"
            # terminate fails if the app is no longer running, which means it crashed
            xcrun simctl terminate "$UDID" "$BUNDLE"
            sips -Z 1400 "docs/screenshots/$name.png" >/dev/null
            index=$((index + 1))
          done

      - name: Save screenshots to the branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Update simulator screenshots" || exit 0
          git push
